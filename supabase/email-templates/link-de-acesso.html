<!DOCTYPE html>
<html lang="pt-BR">
<body style="margin:0;padding:0;background:#08060c;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#08060c;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#110c1c;border:1px solid #3b1f5e;border-radius:20px;">
        <tr><td style="padding:32px 32px 8px;text-align:center;">

          <p style="text-align:center;margin:28px 0;">

        <tr><td style="padding:16px 32px 28px;font-size:11px;color:#71717a;text-align:center;border-top:1px solid #241635;">

    </td></tr>
